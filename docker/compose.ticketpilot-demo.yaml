services:
  ticketpilot_seed:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
    env_file:
      - .env
    environment:
      DATABASE_TYPE: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-agent_service}
      USE_FAKE_MODEL: "true"
      DEFAULT_MODEL: fake
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "seed_ticketpilot_data.py"]
    restart: "no"

  agent_service:
    environment:
      DATABASE_TYPE: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-agent_service}
      USE_FAKE_MODEL: "true"
      DEFAULT_MODEL: fake
      TICKETPILOT_ENABLED: "true"
      TICKETPILOT_REASONER_MODE: deterministic_demo
      TICKETPILOT_AUTH_TOKENS: >-
        {"demo-customer-token":{"tenant_id":"tenant-demo-01","actor_id":"customer-demo-01","role":"CUSTOMER"},"demo-approver-token":{"tenant_id":"tenant-demo-01","actor_id":"approver-demo-01","role":"APPROVER"},"other-tenant-token":{"tenant_id":"tenant-demo-02","actor_id":"approver-demo-02","role":"APPROVER"}}
    depends_on:
      ticketpilot_seed:
        condition: service_completed_successfully

  streamlit_app:
    environment:
      TICKETPILOT_ENABLED: "true"

  ticketpilot_web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "3000:80"
    depends_on:
      agent_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 5s
      timeout: 5s
      retries: 5
