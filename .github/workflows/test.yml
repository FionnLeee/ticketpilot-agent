name: Build and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
      fail-fast: false

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        version: "0.11.32"
    - name: Install dependencies with uv
      run: |
        uv sync --frozen --extra retrieval
      env:
        UV_SYSTEM_PYTHON: 1
    - name: Lint and format with ruff
      run: |
        uv run ruff format --check
        uv run ruff check --output-format github

    - name: Type check with pyrefly
      run: |
        uv run pyrefly check

    - name: Test with pytest
      run: |
        uv run pytest --cov=src/ --cov-report=xml

    - name: Upload coverage reports to Codecov
      # Optional on forks without a CODECOV_TOKEN secret; the test result above is what matters.
      continue-on-error: true
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  lint-markdown:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: "pyproject.toml"
    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        version: "0.11.32"
    - name: Install dependencies with uv
      run: |
        uv sync --frozen --only-group dev
      env:
        UV_SYSTEM_PYTHON: 1
    - name: Lint markdown with pymarkdown
      run: |
        uv run pymarkdown scan README.md README.zh-CN.md

  test-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      - name: Build service image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          provenance: false
          tags: agent-service-toolkit.service:${{ github.sha }}
          file: docker/Dockerfile.service

      - name: Build app image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          provenance: false
          tags: agent-service-toolkit.app:${{ github.sha }}
          file: docker/Dockerfile.app

      - name: Start service container
        run: docker run -d --name service-container --network host -e USE_FAKE_MODEL=true -e PORT=8080 agent-service-toolkit.service:${{ github.sha }}

      - name: Confirm service starts correctly
        run: |
          timeout 90 bash -c '
            while ! curl --fail --silent http://127.0.0.1:8080/health; do
              echo "Waiting for service to be ready..."
              docker logs service-container
              sleep 2
            done
          '

      - name: Run app container
        run: docker run -d --name app-container --network host -e AGENT_URL=http://127.0.0.1:8080 agent-service-toolkit.app:${{ github.sha }}

      - name: Confirm app starts correctly
        run: |
          timeout 90 bash -c '
            while ! curl --fail --silent http://127.0.0.1:8501/_stcore/health; do
              echo "Waiting for app to be ready..."
              docker logs app-container
              sleep 2
            done
          '

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
      - name: Install ONLY CLIENT dependencies with uv
        run: |
          uv sync --frozen --only-group client --only-group dev
        env:
          UV_SYSTEM_PYTHON: 1
      - name: Run integration tests
        run: |
          uv run pytest tests/integration -v --run-docker
        env:
          AGENT_URL: http://127.0.0.1:8080

      - name: Clean up containers
        if: always()
        run: |
          docker stop service-container app-container || true
          docker rm service-container app-container || true

  test-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  test-ticketpilot-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      USE_FAKE_MODEL: "true"
      DEFAULT_MODEL: fake
      DATABASE_TYPE: postgres
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-test-only
      POSTGRES_DB: ticketpilot_ci
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: ticketpilot_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ticketpilot_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
      - run: uv sync --frozen --extra retrieval
      - run: uv run python src/seed_ticketpilot_data.py
      - run: uv run pytest tests/ticketpilot --run-docker -q

  test-hosted-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: ci-database-only
      TICKETPILOT_DOMAIN: localhost
      DEMO_USERNAME: ci-demo
      GATEWAY_BIND: 127.0.0.1
      HTTP_PORT: "8088"
      HTTPS_PORT: "8443"
      DEMO_BASE_URL: https://localhost:8443
      DEMO_CA_FILE: runtime/gateway-ca.crt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
      - run: uv sync --frozen --only-group client --only-group dev
      - name: Generate ephemeral gateway credentials
        run: |
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          echo "DEMO_PASSWORD=$password" >> "$GITHUB_ENV"
          hash=$(printf '%s\n' "$password" | docker run --rm -i caddy:2-alpine caddy hash-password)
          echo "DEMO_PASSWORD_HASH=$hash" >> "$GITHUB_ENV"
      - run: docker compose -f docker/compose.ticketpilot-hosted.yaml up -d --build --wait --wait-timeout 180
      - name: Trust the isolated gateway certificate
        run: |
          mkdir -p runtime
          timeout 60 bash -c 'until docker compose -f docker/compose.ticketpilot-hosted.yaml cp gateway:/data/caddy/pki/authorities/local/root.crt runtime/gateway-ca.crt; do sleep 2; done'
      - run: uv run --no-sync python scripts/ticketpilot_hosted_smoke.py
      - name: Show failure logs
        if: failure()
        run: |
          if test -n "$DEMO_PASSWORD_HASH"; then
            docker compose -f docker/compose.ticketpilot-hosted.yaml logs --tail 100 agent_service gateway
          fi
      - name: Stop isolated CI stack
        if: always()
        run: |
          if test -n "$DEMO_PASSWORD_HASH"; then
            docker compose -f docker/compose.ticketpilot-hosted.yaml down --remove-orphans
          fi
